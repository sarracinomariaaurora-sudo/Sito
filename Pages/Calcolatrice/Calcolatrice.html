<title>Calcolatrice</title>
<script>
function calcola(operazione){
  var n1 = Number(document.getElementById("nmbN1").value);
  var n2 = Number(document.getElementById("nmbN2").value);
  var risultato;

  if(operazione=="+"){
    risultato=n1+n2;
  } else if(operazione=="-"){
    risultato =n1-n2;
  } else if(operazione=="*"){
    risultato=n1*n2;
  } else if(operazione == "/") {
    if(n1 == 0 && n2 == 0){
      alert("Quoziente indeterminato");
      return;
    } else if(n2 == 0){
      alert("Quoziente impossibile");
      return;
    }
    risultato = n1 / n2;
  }
  document.getElementById("nmbR").value = risultato;
  }


</script>
