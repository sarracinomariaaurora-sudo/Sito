    body{
      text-align: center;

    html, body{
      margin:0;
      height:100%;
      background-image:url("../../Images/Backgrounds/Pullov.bg.png");

    }

   margin-top: 70px;

}
.container{
  display:inline-flex;

  padding: 10px;
  margin: 10px  10px;
}
 
  
  /* NAVBAR */

.contenitore {

    display: inline-flex;

    position: fixed;

    top: 0;

    left: 50%;

    transform: translateX(-50%);

    background-color: rgba(255,255,255,0.85);

    padding: 12px 18px;

    margin-top: 10px;

    border-radius: 14px;

    backdrop-filter: blur(6px);

    box-shadow: 0 4px 10px rgba(0,0,0,0.1);

    z-index: 9999;
    color: #C8A27C;
}

.elemento {

    text-align: center;
}

.elemento a {

    text-decoration: none;
    color:#333333;
    transition: 0.3s;
}

.elemento a:hover {

   color:#D2B190;
}



</style>
    <script>
    function sconto_prezzo(){
      var p=Number(document.getElementById("prezzo").value);
      var s=Number(document.getElementById("sconto").value);
      var ps;
      if(p<0 && s>0){
        alert("Il prezzo deve essere positivo");
      }else if(s<0 && p>0){
        alert("Lo sconto deve essere positivo");
      }else if(p<0 && s<0){
        alert("Devi reinserire tutto!");
      }else{
         ps= p-(p*s/100);
      document.getElementById("prezzo_scontato").value = ps;
      }
    }
    </script>
